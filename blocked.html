<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#d9eff0">
	<title>Take a breath | Head In The Clouds</title>
	<style>
		:root {
			color-scheme: light;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			color: #23423d;
			background: #d9eff0;
		}

		* {
			box-sizing: border-box;
		}

		body {
			display: grid;
			min-height: 100vh;
			min-height: 100svh;
			margin: 0;
			overflow: hidden;
			place-items: center;
			background: linear-gradient(180deg, #d9eff0 0%, #e8f4e9 72%, #f4f0dc 100%);
		}

		.sky {
			position: fixed;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			z-index: 0;
		}

		.cloudscape {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.message {
			position: relative;
			z-index: 1;
			width: min(440px, calc(100% - 40px));
			padding: 48px 24px;
			text-align: center;
			animation: appear .7s ease-out both;
		}

		.mark {
			display: grid;
			width: 46px;
			height: 46px;
			margin: 0 auto 22px;
			place-items: center;
			border: 1px solid rgba(181, 31, 46, .45);
			border-radius: 50%;
			color: #b51f2e;
			font-family: Georgia, serif;
			font-size: 15px;
		}

		.eyebrow {
			margin: 0 0 12px;
			color: #b65f43;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 1.5px;
		}

		h1 {
			margin: 0 0 24px;
			color: #111;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 46px;
			font-weight: 400;
			line-height: 1.08;
		}

		.copy {
			margin: 16px auto 26px;
			color: #55706a;
			font-size: 15px;
			line-height: 1.6;
		}

		#contBtn {
			display: block;
			margin: 0 auto;
			min-height: 46px;
			padding: 0 20px;
			border: 2px solid #b51f2e;
			border-radius: 4px;
			background: transparent;
			color: #b51f2e;
			font: inherit;
			font-size: 14px;
			font-weight: 700;
			cursor: pointer;
			transition: border-color .18s ease, color .18s ease, transform .18s ease;
		}

		#contBtn:hover {
			transform: translateY(-2px);
			border-color: #861723;
			background: transparent;
			color: #861723;
		}

		#contBtn:focus-visible {
			outline: 3px solid #b51f2e;
			outline-offset: 3px;
		}

		@keyframes appear {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 420px) {
			h1 {
				font-size: 38px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.message {
				animation: none;
			}

			#contBtn {
				transition: none;
			}
		}
	</style>
</head>
<body>
	<div class="sky" aria-hidden="true">
		<img class="cloudscape" src="cloudscape.svg" alt="">
	</div>
	<main class="message">
		<div class="mark" aria-hidden="true">HC</div>
		<h1>Are you sure?</h1>
		<button id="contBtn" type="button">Continue anyway</button>
	</main>
	<script src="blocked.js"></script>
</body>
</html>
