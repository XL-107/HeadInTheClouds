<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Head In The Clouds</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Head In The Clouds</h1>
  <div class="toolbar" role="tablist" aria-label="Popup sections">
    <button id="permissionsTab" type="button" role="tab" aria-selected="true" aria-controls="permissionsPanel" tabindex="0">Permissions</button>
    <button id="overviewTab" type="button" role="tab" aria-selected="false" aria-controls="overviewPanel" tabindex="-1">Overview</button>
    <button id="otherTab" type="button" role="tab" aria-selected="false" aria-controls="otherPanel" tabindex="-1">Other</button>
  </div>
  <section id="permissionsPanel" class="tab-panel" role="tabpanel" aria-labelledby="permissionsTab">
    <input type="text" id="domainInput" placeholder="e.g., example.com" />
    <button id="addBtn" type="button">Block</button>
    <ul id="ruleList"></ul>
  </section>
  <section id="overviewPanel" class="tab-panel" role="tabpanel" aria-labelledby="overviewTab" hidden></section>
  <section id="otherPanel" class="tab-panel" role="tabpanel" aria-labelledby="otherTab" hidden></section>
  <script src="main.js"></script>
</body>

</html>
